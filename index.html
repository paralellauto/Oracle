<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Oracle</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;height:-webkit-fill-available;overflow:hidden;}
body{
  font-family:'Inter',sans-serif;
  height:100vh;
  height:100dvh;
  width:100vw;
  overflow:hidden;
  color:#fff;
  transition:background 1.5s ease;
}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:inherit;}

body.despertar-bg{background:radial-gradient(ellipse at 20% 20%,#d4608a,transparent 55%),radial-gradient(ellipse at 80% 80%,#e89060,transparent 55%),radial-gradient(ellipse at 60% 10%,#b87ab0,transparent 45%),#1a0a10;}
body.soltar-bg{background:radial-gradient(ellipse at 20% 30%,#c06030,transparent 55%),radial-gradient(ellipse at 80% 70%,#608050,transparent 55%),radial-gradient(ellipse at 50% 90%,#a09060,transparent 45%),#0f100a;}
body.crecer-bg{background:radial-gradient(ellipse at 20% 20%,#5090a0,transparent 55%),radial-gradient(ellipse at 80% 80%,#7080c0,transparent 55%),radial-gradient(ellipse at 50% 50%,#9070b0,transparent 45%),#080f14;}
body.integrar-bg{background:radial-gradient(ellipse at 20% 30%,#6050a0,transparent 55%),radial-gradient(ellipse at 80% 60%,#4070b0,transparent 55%),radial-gradient(ellipse at 50% 90%,#8090c0,transparent 45%),#08080f;}

.screen{display:none;height:100vh;width:100vw;overflow:hidden;}
.screen.active{display:flex;flex-direction:column;}

/* ── LOGIN ── */
#loginScreen{
  align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 30% 30%,#9060a088,transparent 60%),radial-gradient(ellipse at 70% 70%,#d08060aa,transparent 60%),#0d0a12;
  padding:1.5rem;
}
.login-box{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:1.6rem;}
.oracle-wordmark{font-family:'Cormorant Garamond',serif;font-size:2.8rem;font-weight:300;letter-spacing:.4em;color:#fff;text-align:center;}
.oracle-star{font-size:1.4rem;display:block;text-align:center;opacity:.7;margin-bottom:.2rem;}
.oracle-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.9rem;letter-spacing:.12em;opacity:.6;text-align:center;}
.lang-row{display:flex;gap:.5rem;}
.lbtn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:.35rem .9rem;color:rgba(255,255,255,.5);font-size:.72rem;letter-spacing:.12em;cursor:pointer;transition:all .3s;font-family:'Inter',sans-serif;}
.lbtn.on{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.5);color:#fff;}
.login-fields{width:100%;display:flex;flex-direction:column;gap:.75rem;}
.login-fields input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:.85rem 1rem;color:#fff;font-family:'Inter',sans-serif;font-size:16px;letter-spacing:.04em;outline:none;transition:border .3s;-webkit-appearance:none;}
.login-fields input:focus{border-color:rgba(255,255,255,.4);}
.login-fields input::placeholder{color:rgba(255,255,255,.3);}
.btn-main{width:100%;background:linear-gradient(135deg,rgba(200,100,140,.7),rgba(160,80,180,.7));border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:.9rem;color:#fff;font-family:'Cormorant Garamond',serif;font-size:1.1rem;letter-spacing:.25em;cursor:pointer;transition:opacity .3s;}
.btn-main:active{opacity:.75;}
.err{color:#f4a07a;font-size:.75rem;text-align:center;min-height:.9rem;letter-spacing:.04em;}

/* ── MAIN ── */
#mainScreen{position:relative;}

.header{
  position:fixed;
  top:0;left:0;right:0;
  z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:env(safe-area-inset-top, 0px) 1rem 0;
  padding-top:max(env(safe-area-inset-top, 0px), 12px);
  padding-bottom:10px;
  height:calc(52px + env(safe-area-inset-top, 0px));
  background:rgba(0,0,0,.25);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.hdr-logo{font-family:'Cormorant Garamond',serif;font-size:1.1rem;letter-spacing:.35em;font-weight:300;}
.hdr-right{display:flex;align-items:center;gap:.6rem;}
.hdr-name{font-size:.68rem;opacity:.4;letter-spacing:.06em;}
.btn-logout{background:none;border:none;color:rgba(255,255,255,.3);font-size:.85rem;cursor:pointer;padding:.2rem .3rem;}

/* Scroll container */
.scroll-area{
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  overflow-y:scroll;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.scroll-area::-webkit-scrollbar{display:none;}

/* ── PANELS ── */
.panel{
  width:100%;
  height:100vh;
  height:100dvh;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

/* Panel 1 — Cover */
.panel-cover{
  padding:60px 1.2rem 2rem;
  justify-content:space-between;
}
.cover-top{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:.7rem;
}
.cover-section-num{font-family:'Cormorant Garamond',serif;font-size:.85rem;letter-spacing:.4em;opacity:.6;}
.cover-star-big{font-size:2.5rem;opacity:.45;display:block;text-align:center;}
.cover-section-name{font-family:'Cormorant Garamond',serif;font-size:.9rem;letter-spacing:.5em;opacity:.75;}
.cover-date{font-size:.65rem;letter-spacing:.15em;opacity:.4;text-align:center;margin-top:.3rem;}
.section-pills-row{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;}
.spill{font-size:.58rem;letter-spacing:.12em;padding:.22rem .6rem;border-radius:20px;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.35);background:rgba(255,255,255,.04);}
.spill.on{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.45);color:#fff;}
.scroll-hint{display:flex;flex-direction:column;align-items:center;gap:.3rem;opacity:.3;animation:bounce 2s infinite;padding-bottom:.5rem;}
.scroll-hint span{font-size:.6rem;letter-spacing:.15em;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(5px);}}

/* Panel 2 — Story card */
.panel-card{
  padding:60px .8rem 1rem;
  justify-content:flex-start;
  gap:.6rem;
}
.story-card{
  width:100%;
  max-width:320px;
  height:calc(100dvh - 160px);
  max-height:560px;
  border-radius:18px;
  overflow:hidden;
  display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;
  padding:1.2rem 1rem 1rem;
  box-shadow:0 30px 80px rgba(0,0,0,.5);
  flex-shrink:0;
}
.sc-numeral{font-family:'Cormorant Garamond',serif;font-size:.72rem;letter-spacing:.4em;color:rgba(255,255,255,.65);text-align:center;}
.sc-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.6rem,5vw,2.1rem);font-weight:400;color:#fff;text-align:center;line-height:1.1;}
.sc-reflection{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(.75rem,2.5vw,.85rem);line-height:1.65;
  text-align:center;color:rgba(255,255,255,.9);
  flex:1;display:flex;align-items:center;padding:.3rem 0;
  overflow:hidden;
}
.sc-prompt-wrap{position:relative;width:120px;height:70px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sc-prompt-svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:135px;height:135px;}
.sc-prompt-path-text{font-size:8.5px;fill:rgba(255,255,255,.8);font-family:'Cormorant Garamond',serif;font-style:italic;}
.sc-star-mid{font-size:.9rem;}
.sc-aff{text-align:center;}
.sc-aff-label{display:block;font-size:.58rem;letter-spacing:.2em;color:rgba(255,255,255,.55);text-transform:uppercase;margin-bottom:.2rem;}
.sc-aff-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(.78rem,2.5vw,.88rem);color:#fff;line-height:1.4;}
.share-pill{margin-top:.7rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:.35rem .9rem;font-size:.65rem;letter-spacing:.12em;color:rgba(255,255,255,.6);cursor:pointer;display:flex;align-items:center;gap:.4rem;transition:all .3s;flex-shrink:0;}

/* Panel gradients */
.gd-despertar{background:radial-gradient(ellipse at 30% 25%,#e07090,transparent 60%),radial-gradient(ellipse at 75% 70%,#d08050,transparent 55%),radial-gradient(ellipse at 50% 95%,#b070c0,transparent 45%),#c07080;}
.gd-soltar{background:radial-gradient(ellipse at 35% 25%,#d07040,transparent 60%),radial-gradient(ellipse at 70% 75%,#80a868,transparent 55%),radial-gradient(ellipse at 20% 75%,#b0a060,transparent 45%),#b08860;}
.gd-crecer{background:radial-gradient(ellipse at 25% 35%,#68b0b0,transparent 60%),radial-gradient(ellipse at 75% 30%,#8090d0,transparent 55%),radial-gradient(ellipse at 50% 90%,#c090d0,transparent 45%),#80a8c0;}
.gd-integrar{background:radial-gradient(ellipse at 35% 30%,#8878c8,transparent 60%),radial-gradient(ellipse at 75% 65%,#6090d0,transparent 55%),radial-gradient(ellipse at 20% 75%,#a0b8e0,transparent 45%),#7880c0;}

/* Panels 3-5 shared */
.inner-panel{
  width:100%;max-width:340px;
  display:flex;flex-direction:column;gap:1rem;
  padding:0 .5rem;
  max-height:100%;
  overflow-y:auto;
  scrollbar-width:none;
  align-items:stretch;
}
.inner-panel::-webkit-scrollbar{display:none;}
.panel-heading{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:400;text-align:center;opacity:.9;letter-spacing:.04em;}
.panel-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.82rem;opacity:.5;text-align:center;line-height:1.6;}
.textarea-styled{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:.9rem;color:#fff;font-family:'Cormorant Garamond',serif;font-size:1rem;line-height:1.65;resize:none;outline:none;transition:border .3s;-webkit-appearance:none;font-size:16px;}
.textarea-styled:focus{border-color:rgba(255,255,255,.35);}
.textarea-styled::placeholder{color:rgba(255,255,255,.25);font-style:italic;}
.char-count{font-size:.62rem;opacity:.3;text-align:right;}
.btn-action{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:.7rem;color:#fff;font-family:'Cormorant Garamond',serif;font-size:.9rem;letter-spacing:.15em;cursor:pointer;transition:all .3s;width:100%;}
.btn-action:active{opacity:.7;}
.saved-note{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:.9rem;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.92rem;line-height:1.7;color:rgba(255,255,255,.75);}
.note-label{font-size:.58rem;letter-spacing:.18em;opacity:.4;text-transform:uppercase;margin-bottom:.35rem;display:block;font-family:'Inter',sans-serif;}
.oracle-answer{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:1rem;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.95rem;line-height:1.75;color:rgba(255,255,255,.85);}
.oracle-locked{text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.82rem;opacity:.4;line-height:1.6;}
@keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}
.loading-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);animation:pulse 1s infinite;margin-left:4px;}

/* Panel 5 — Notify */
.notify-card{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:1.3rem;display:flex;flex-direction:column;gap:.75rem;}
.notify-price{font-family:'Cormorant Garamond',serif;font-size:2rem;text-align:center;opacity:.9;}
.notify-price span{font-size:.82rem;opacity:.5;letter-spacing:.08em;}
.notify-perks{display:flex;flex-direction:column;gap:.4rem;}
.perk{display:flex;align-items:center;gap:.6rem;font-size:.78rem;opacity:.6;}
.perk-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5);flex-shrink:0;}
.btn-notify{width:100%;background:linear-gradient(135deg,rgba(180,100,140,.6),rgba(120,80,180,.6));border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:.85rem;color:#fff;font-family:'Cormorant Garamond',serif;font-size:.95rem;letter-spacing:.2em;cursor:pointer;}
.notify-legal{font-size:.6rem;opacity:.3;text-align:center;letter-spacing:.04em;line-height:1.6;}

/* Nav dots */
.nav-dots{position:fixed;right:.75rem;top:50%;transform:translateY(-50%);z-index:200;display:flex;flex-direction:column;gap:.45rem;}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s;cursor:pointer;}
.dot.on{background:rgba(255,255,255,.85);transform:scale(1.4);}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="screen active">
  <div class="login-box">
    <div style="text-align:center">
      <span class="oracle-star">✦</span>
      <div class="oracle-wordmark">ORACLE</div>
      <div class="oracle-sub" id="lSub">tu carta del día</div>
    </div>
    <div class="lang-row">
      <button class="lbtn on" onclick="setLang('es',1)">ES</button>
      <button class="lbtn" onclick="setLang('en',1)">EN</button>
    </div>
    <div class="login-fields">
      <input id="iName" type="text" placeholder="tu nombre" autocomplete="off" autocorrect="off">
      <input id="iEmail" type="email" placeholder="tu correo" autocomplete="off" autocorrect="off">
      <div class="err" id="errMsg"></div>
      <button class="btn-main" id="btnEnter" onclick="login()">ENTRAR</button>
    </div>
  </div>
</div>

<!-- MAIN -->
<div id="mainScreen" class="screen">

  <div class="header">
    <div class="hdr-logo">✦ ORACLE</div>
    <div class="hdr-right">
      <div class="lang-row">
        <button class="lbtn" id="hEs" onclick="setLang('es')">ES</button>
        <button class="lbtn" id="hEn" onclick="setLang('en')">EN</button>
      </div>
      <span class="hdr-name" id="hName"></span>
      <button class="btn-logout" onclick="logout()">✕</button>
    </div>
  </div>

  <div class="nav-dots" id="navDots">
    <div class="dot on" onclick="goPanel(0)"></div>
    <div class="dot" onclick="goPanel(1)"></div>
    <div class="dot" onclick="goPanel(2)"></div>
    <div class="dot" onclick="goPanel(3)"></div>
    <div class="dot" onclick="goPanel(4)"></div>
  </div>

  <div class="scroll-area" id="scrollArea">

    <!-- P1: Cover -->
    <div class="panel panel-cover" id="p0">
      <div class="cover-top">
        <div class="section-pills-row" id="pills"></div>
        <span class="cover-section-num" id="covNum">I</span>
        <span class="cover-star-big">✦</span>
        <div class="cover-section-name" id="covSec">DESPERTAR</div>
        <div class="cover-date" id="covDate"></div>
      </div>
      <div class="scroll-hint">
        <span id="scrollHintTxt">desliza para revelar</span>
        <span>↓</span>
      </div>
    </div>

    <!-- P2: Card -->
    <div class="panel panel-card" id="p1">
      <div class="story-card" id="storyCard">
        <div class="sc-numeral" id="scNum">I</div>
        <div class="sc-title" id="scTitle"></div>
        <div class="sc-reflection" id="scRefl"><span></span></div>
        <div class="sc-prompt-wrap">
          <svg class="sc-prompt-svg" viewBox="0 0 135 135">
            <defs>
              <path id="cp" d="M 67.5,67.5 m -48,0 a 48,48 0 1,1 96,0 a 48,48 0 1,1 -96,0"/>
            </defs>
            <text class="sc-prompt-path-text">
              <textPath href="#cp" id="ptxt" startOffset="0%"></textPath>
            </text>
          </svg>
          <span class="sc-star-mid">✦</span>
        </div>
        <div class="sc-aff">
          <span class="sc-aff-label" id="affLbl">Afirmación</span>
          <div class="sc-aff-text" id="affTxt"></div>
        </div>
      </div>
      <button class="share-pill" onclick="shareCard()" id="shareBtn">
        <span>↑</span><span id="shareTxt">compartir</span>
      </button>
    </div>

    <!-- P3: Reflection -->
    <div class="panel" id="p2" style="justify-content:flex-start;padding-top:0;">
      <div class="inner-panel">
        <div class="panel-heading" id="reflHeading">Tu reflexión</div>
        <div class="panel-sub" id="reflSub">¿Qué te despertó esta carta?</div>
        <div id="reflDisplay" style="display:none">
          <span class="note-label" id="reflNoteLabel">tu nota de hoy</span>
          <div class="saved-note" id="savedNoteDisplay"></div>
          <button class="btn-action" id="editNoteBtn" onclick="editNote()" style="margin-top:.6rem"></button>
        </div>
        <div id="reflEdit">
          <textarea class="textarea-styled" id="reflTa" rows="4" maxlength="500"></textarea>
          <div class="char-count" id="reflCount">0 / 500</div>
          <button class="btn-action" id="saveNoteBtn" onclick="saveNote()"></button>
        </div>
      </div>
    </div>

    <!-- P4: Ask oracle -->
    <div class="panel" id="p3" style="justify-content:flex-start;padding-top:0;">
      <div class="inner-panel">
        <div class="panel-heading" id="askHeading">El oráculo</div>
        <div class="panel-sub" id="askSub">Una pregunta, una respuesta.</div>
        <div id="askInputArea">
          <textarea class="textarea-styled" id="askTa" rows="3" maxlength="280" style="min-height:75px;"></textarea>
          <button class="btn-action" id="askBtn" onclick="askOracle()" style="margin-top:.6rem"></button>
        </div>
        <div id="oracleAnswerWrap" style="display:none">
          <span class="note-label" id="oracleQLabel">tu pregunta</span>
          <div class="saved-note" id="oracleQDisplay"></div>
          <span class="note-label" style="margin-top:.7rem;display:block;" id="oracleALabel">respuesta del oráculo</span>
          <div class="oracle-answer" id="oracleAnswer"></div>
          <div class="oracle-locked" id="oracleLocked" style="margin-top:.5rem;"></div>
        </div>
      </div>
    </div>

    <!-- P5: Notify -->
    <div class="panel" id="p4" style="justify-content:flex-start;padding-top:0;">
      <div class="inner-panel">
        <div class="panel-heading" id="notifHeading"></div>
        <div class="notify-card">
          <div class="sc-aff-label" style="text-align:center;" id="notifTitle"></div>
          <div class="notify-price"><span id="notifPer"></span>$1 <span id="notifMo">/ mes</span></div>
          <div class="notify-perks" id="notifPerks"></div>
          <button class="btn-notify" id="notifBtn" onclick="notifyPlaceholder()"></button>
        </div>
        <div class="notify-legal" id="notifLegal"></div>
      </div>
    </div>

  </div>
</div>

<script>
const SHEETS_URL='https://script.google.com/a/macros/paralellautomation.com/s/AKfycbwjzBpmqGyq9aeS_qhSINSe5RqkkX95XTjkJLqwfnFSoLCb0dDeFqF7oRFuqV10rMiKfA/exec';

const CARDS=[
{id:1,s:'despertar',sn:'I',es:{title:'El umbral',prompt:'¿Qué estoy esperando que pase para empezar a moverme?',refl:'Estás paradx frente a una puerta que aún no has abierto.\nNo tienes que saber qué hay del otro lado.\nSolo tienes que saber que ya es tiempo de dejar de mirarla y empezar a tocarla.',aff:'"Doy el primer paso aunque no vea el camino completo."'},en:{title:'The Threshold',prompt:'What am I waiting for to start moving?',refl:'You are standing in front of a door you have not yet opened.\nYou don\'t need to know what is on the other side.\nYou only need to know it is time to stop looking at it and start touching it.',aff:'"I take the first step even if I can\'t see the full path."'}},
{id:2,s:'despertar',sn:'I',es:{title:'La llamada',prompt:'¿Qué es lo que mi interior lleva tiempo queriendo decirme?',refl:'Hay algo que te llama desde adentro.\nNo es ruido, no es urgencia.\nEs esa voz que aparece cuando todo está en silencio y dice tu nombre de una manera que solo tú reconoces.',aff:'"Escucho la voz que me guía desde adentro."'},en:{title:'The Call',prompt:'What has my inner self been trying to tell me?',refl:'There is something calling you from within.\nIt is not noise, not urgency.\nIt is that voice that appears when everything is silent and says your name in a way only you recognize.',aff:'"I listen to the voice that guides me from within."'}},
{id:3,s:'despertar',sn:'I',es:{title:'La semilla',prompt:'¿Qué está creciendo en mí aunque aún no lo pueda nombrar?',refl:'No todo lo que crece se ve al principio.\nDebajo de la tierra, en la oscuridad más profunda, algo tuyo está echando raíces.\nConfía en lo que no puedes ver todavía.',aff:'"Lo que siembro con intención, florece a su tiempo."'},en:{title:'The Seed',prompt:'What is growing in me even if I cannot name it yet?',refl:'Not everything that grows is visible at first.\nUnderground, in the deepest darkness, something of yours is taking root.\nTrust in what you cannot yet see.',aff:'"What I sow with intention, blooms in its own time."'}},
{id:4,s:'despertar',sn:'I',es:{title:'El asombro',prompt:'¿Cuándo fue la última vez que algo me dejó sin palabras?',refl:'Hubo un tiempo en que te maravillabas de todo.\nEse niño o niña sigue viviendo dentro de ti.\nHoy el universo te invita a recuperar esa mirada:\nLa que encuentra magia en lo ordinario.',aff:'"Abro mis ojos a la maravilla que habita en lo cotidiano."'},en:{title:'Wonder',prompt:'When was the last time something left me speechless?',refl:'There was a time when you marveled at everything.\nThat child still lives inside you.\nToday the universe invites you to reclaim that gaze:\nThe one that finds magic in the ordinary.',aff:'"I open my eyes to the wonder that lives in the everyday."'}},
{id:5,s:'despertar',sn:'I',es:{title:'La curiosidad',prompt:'¿Qué pregunta llevo tiempo evitando hacerme?',refl:'No necesitas tener todas las respuestas.\nNecesitas tener las preguntas correctas.\nLa curiosidad es la linterna que ilumina el camino cuando todavía no sabes a dónde vas.',aff:'"Soy libre de no saber y de querer descubrir."'},en:{title:'Curiosity',prompt:'What question have I been avoiding asking myself?',refl:'You don\'t need to have all the answers.\nYou need to have the right questions.\nCuriosity is the lantern that lights the path when you still don\'t know where you\'re going.',aff:'"I am free not to know and to want to discover."'}},
{id:6,s:'despertar',sn:'I',es:{title:'El espejo',prompt:'¿Qué me está mostrando esta persona o situación sobre mí?',refl:'Lo que ves en los demás que te molesta, que admiras, que te mueve, es también tuyo.\nEl universo te pone espejos donde menos los esperas.\nMírate en ellos con honestidad y sin miedo.',aff:'"Todo lo que veo afuera me enseña algo sobre lo que vive adentro."'},en:{title:'The Mirror',prompt:'What is this person or situation showing me about myself?',refl:'What you see in others that bothers you, that you admire, that moves you — it is also yours.\nThe universe places mirrors where you least expect them.\nLook at yourself in them with honesty and without fear.',aff:'"Everything I see outside teaches me something about what lives within."'}},
{id:7,s:'despertar',sn:'I',es:{title:'El cuerpo',prompt:'¿En qué parte de mi cuerpo estoy cargando algo que no es mío?',refl:'Tu cuerpo sabe cosas que tu mente aún no ha procesado.\nCuando se tensa, avisa. Cuando se expande, celebra.\nHoy párate un momento. Respira.\n¿Qué te está diciendo el cuerpo que llevas?',aff:'"Habito mi cuerpo con presencia y gratitud."'},en:{title:'The Body',prompt:'In what part of my body am I carrying something that is not mine?',refl:'Your body knows things your mind has not yet processed.\nWhen it tenses, it warns. When it expands, it celebrates.\nToday, pause for a moment. Breathe.\nWhat is the body you carry trying to tell you?',aff:'"I inhabit my body with presence and gratitude."'}},
{id:8,s:'despertar',sn:'I',es:{title:'La intuición',prompt:'¿Qué me está diciendo mi intuición que mi mente está tratando de ignorar?',refl:'Antes de que la mente razone, algo en ti ya sabe.\nEsa certeza que aparece sin explicación,\nese "Algo no está bien" o ese "Este es el camino":\nno lo ignores. Es el universo hablándote en tu idioma.',aff:'"Confío en lo que siento antes de que tenga nombre."'},en:{title:'Intuition',prompt:'What is my intuition telling me that my mind is trying to ignore?',refl:'Before the mind reasons, something in you already knows.\nThat certainty that appears without explanation,\nthat "Something is not right" or "This is the way" —\ndon\'t ignore it. It is the universe speaking to you in your language.',aff:'"I trust what I feel before it has a name."'}},
{id:9,s:'despertar',sn:'I',es:{title:'La pausa',prompt:'¿Qué podría ver si me dejo quietx un momento?',refl:'No todo lo que parece quietud es pérdida de tiempo.\nA veces el universo te detiene porque necesitas ver lo que no puedes ver mientras corres.\nLa pausa también es movimiento hacia adentro.',aff:'"En el silencio encuentro las respuestas que busco."'},en:{title:'The Pause',prompt:'What could I see if I allow myself to be still for a moment?',refl:'Not everything that looks like stillness is a waste of time.\nSometimes the universe stops you because you need to see what you cannot see while running.\nThe pause is also movement inward.',aff:'"In silence I find the answers I seek."'}},
{id:10,s:'despertar',sn:'I',es:{title:'El origen',prompt:'¿Qué carga llevo que no elegí pero que puedo soltar?',refl:'Viene de algún lugar todo lo que eres.\nHay heridas que no son tuyas, pero que cargas.\nHay dones que recibiste sin pedirlos.\nConocer tu origen no es quedarte en él:\nEs saber desde dónde partes para decidir a dónde vas.',aff:'"Honro de dónde vengo y elijo quién quiero ser."'},en:{title:'The Origin',prompt:'What weight am I carrying that I didn\'t choose but can release?',refl:'Everything you are comes from somewhere.\nThere are wounds that are not yours, but that you carry.\nThere are gifts you received without asking for them.\nKnowing your origin is not staying in it:\nIt is knowing where you start from to decide where you go.',aff:'"I honor where I come from and I choose who I want to be."'}},
{id:11,s:'despertar',sn:'I',es:{title:'El instante',prompt:'¿Estoy realmente presente en mi propia vida?',refl:'No estás en el pasado. No estás en el futuro.\nEstás aquí, en este momento exacto,\nque es el único lugar donde la vida sucede de verdad.\nRespira. Esto es real. Tú eres real.',aff:'"Este momento es suficiente. Yo soy suficiente."'},en:{title:'The Instant',prompt:'Am I truly present in my own life?',refl:'You are not in the past. You are not in the future.\nYou are here, in this exact moment,\nwhich is the only place where life truly happens.\nBreathe. This is real. You are real.',aff:'"This moment is enough. I am enough."'}},
{id:12,s:'despertar',sn:'I',es:{title:'La voluntad',prompt:'¿Qué elegiría hacer hoy si no dependiera de cómo me siento?',refl:'Hay una fuerza en ti que no depende de cómo te sientas.\nNo espera a que la inspiración llegue.\nSe levanta cuando todo dice que no.\nEsa fuerza se llama voluntad, y es tuya.',aff:'"Mi voluntad es más grande que mi miedo."'},en:{title:'The Will',prompt:'What would I choose to do today if it didn\'t depend on how I feel?',refl:'There is a force in you that does not depend on how you feel.\nIt does not wait for inspiration to arrive.\nIt rises when everything says no.\nThat force is called will, and it is yours.',aff:'"My will is greater than my fear."'}},
{id:13,s:'despertar',sn:'I',es:{title:'La luz propia',prompt:'¿En qué momento de mi vida he brillado más siendo yo mismx?',refl:'No necesitas que nadie te ilumine.\nTienes tu propia fuente de luz,\ny aunque a veces la sientas pequeña o apagada,\nsiempre está ahí. Siempre.\nNadie puede apagarla salvo tú.',aff:'"Mi luz no depende de nadie más que de mí."'},en:{title:'Your Own Light',prompt:'In what moment of my life have I shone brightest being myself?',refl:'You don\'t need anyone to illuminate you.\nYou have your own source of light,\nand even when it feels small or dim,\nit is always there. Always.\nNo one can extinguish it but you.',aff:'"My light depends on no one but me."'}},
{id:14,s:'soltar',sn:'II',es:{title:'El peso',prompt:'¿Qué estoy sosteniendo que ya no me pertenece sostener?',refl:'Hay cosas que cargas por costumbre, no por necesidad.\nAlgunas ni siquiera son tuyas.\nHoy el universo te pregunta:\n¿Qué seguirías cargando si supieras que puedes soltarlo?',aff:'"Suelto lo que ya no me sirve con gratitud y sin culpa."'},en:{title:'The Weight',prompt:'What am I holding that no longer belongs to me to hold?',refl:'There are things you carry out of habit, not out of need.\nSome are not even yours.\nToday the universe asks you:\nWhat would you keep carrying if you knew you could let it go?',aff:'"I release what no longer serves me, with gratitude and without guilt."'}},
{id:15,s:'soltar',sn:'II',es:{title:'El control',prompt:'¿Qué estoy intentando controlar que está fuera de mis manos?',refl:'Apretar los puños no cambia el resultado.\nHay cosas que solo ocurren cuando las dejas ir.\nSoltar no es rendirse.\nEs confiar en que el universo también trabaja cuando tú descansas.',aff:'"Confío en el proceso aunque no pueda dirigirlo."'},en:{title:'Control',prompt:'What am I trying to control that is out of my hands?',refl:'Clenching your fists doesn\'t change the outcome.\nThere are things that only happen when you let them go.\nLetting go is not giving up.\nIt is trusting that the universe also works while you rest.',aff:'"I trust the process even if I cannot direct it."'}},
{id:16,s:'soltar',sn:'II',es:{title:'El perdón',prompt:'¿A quién o qué necesito perdonar para liberarme?',refl:'Perdonar no es decir que estuvo bien.\nEs decidir que ya no quieres cargar ese dolor en el cuerpo y mente.\nEl perdón no es un regalo para quien te lastimó.\nEs la libertad que te das a ti.',aff:'"Me libero perdonando, no porque lo merezcan, sino porque yo lo merezco."'},en:{title:'Forgiveness',prompt:'Who or what do I need to forgive to free myself?',refl:'Forgiving is not saying it was okay.\nIt is deciding you no longer want to carry that pain in your body and mind.\nForgiveness is not a gift to the one who hurt you.\nIt is the freedom you give yourself.',aff:'"I free myself by forgiving — not because they deserve it, but because I do."'}},
{id:17,s:'soltar',sn:'II',es:{title:'La identidad vieja',prompt:'¿Qué versión de mí mismx estoy sosteniendo que ya no me representa?',refl:'Ya no eres quien eras hace un año.\nNi hace cinco.\nY sin embargo, a veces actúas desde una versión de ti que ya no existe.\nDate permiso de ser quien eres hoy.',aff:'"Me permito ser quien soy hoy, no quien fui en el pasado."'},en:{title:'The Old Identity',prompt:'What version of myself am I holding onto that no longer represents me?',refl:'You are no longer who you were a year ago.\nNor five years ago.\nAnd yet, sometimes you act from a version of yourself that no longer exists.\nGive yourself permission to be who you are today.',aff:'"I allow myself to be who I am today, not who I was in the past."'}},
{id:18,s:'soltar',sn:'II',es:{title:'El miedo',prompt:'¿Qué haría si supiera que el miedo no me puede detener?',refl:'El miedo no desaparece cuando eres valiente.\nDesaparece cuando decides que lo que quieres,\nvale más que el miedo que sientes.\nNo tienes que esperar a no tener miedo. Avanza con él.',aff:'"Actúo aunque sienta miedo. El miedo no es la señal de parar."'},en:{title:'Fear',prompt:'What would I do if I knew fear couldn\'t stop me?',refl:'Fear does not disappear when you are brave.\nIt disappears when you decide that what you want\nis worth more than the fear you feel.\nYou don\'t have to wait until you\'re fearless. Move forward with it.',aff:'"I act even when I feel fear. Fear is not the signal to stop."'}},
{id:19,s:'soltar',sn:'II',es:{title:'La comparación',prompt:'¿A quién estoy mirando para juzgar dónde debería estar yo?',refl:'No hay camino con el que comparar el tuyo\nporque nadie en la historia ha vivido tu vida exacta.\nMedir tu proceso con el de otros,\nes usar una regla equivocada para medir algo que no tiene medida.',aff:'"Mi camino es único y mi ritmo es el correcto para mí."'},en:{title:'Comparison',prompt:'Who am I looking at to judge where I should be?',refl:'There is no path to compare yours with,\nbecause no one in history has lived your exact life.\nMeasuring your process against others\nis using the wrong ruler to measure something that has no measure.',aff:'"My path is unique and my pace is the right one for me."'}},
{id:20,s:'soltar',sn:'II',es:{title:'La queja',prompt:'¿Qué historia me cuento sobre mí mismx que ya no quiero seguir contando?',refl:'Hay una diferencia entre sentir el dolor y quedarte a vivir en él.\nEl universo escucha todo lo que repites.\nCambia el relato y cambia la frecuencia que emites.',aff:'"Elijo el relato que me expande, no el que me limita."'},en:{title:'The Complaint',prompt:'What story do I tell myself that I no longer want to keep telling?',refl:'There is a difference between feeling pain and staying to live in it.\nThe universe hears everything you repeat.\nChange the story and change the frequency you emit.',aff:'"I choose the story that expands me, not the one that limits me."'}},
{id:21,s:'soltar',sn:'II',es:{title:'La expectativa',prompt:'¿Qué expectativa estoy sosteniendo que me impide ver lo que ya tengo?',refl:'Las expectativas son futuros imaginados a los que les das poder sobre tu presente.\nCuando sueltas lo que crees que "debería" pasar, puedes ver lo que realmente está pasando.',aff:'"Suelto el cómo y confío en el qué."'},en:{title:'Expectation',prompt:'What expectation am I holding that prevents me from seeing what I already have?',refl:'Expectations are imagined futures that you give power over your present.\nWhen you release what you think "should" happen, you can see what is really happening.',aff:'"I release the how and trust in the what."'}},
{id:22,s:'soltar',sn:'II',es:{title:'La culpa',prompt:'¿Estoy aprendiendo de lo que pasó, o simplemente me estoy castigando?',refl:'Aprender de lo que hiciste no es lo mismo que castigarte por ello.\nYa cometiste el error. Ya lo sabes.\nAhora la pregunta es: ¿Qué haces con esa información?\nLa culpa no repara nada. La responsabilidad, sí.',aff:'"Aprendo, corrijo y sigo. No me quedo atrapadx en lo que ya fue."'},en:{title:'Guilt',prompt:'Am I learning from what happened, or am I simply punishing myself?',refl:'Learning from what you did is not the same as punishing yourself for it.\nYou already made the mistake.\nNow the question is: What do you do with that information?\nGuilt repairs nothing. Responsibility does.',aff:'"I learn, I correct, and I continue. I don\'t stay trapped in what already was."'}},
{id:23,s:'soltar',sn:'II',es:{title:'El apego',prompt:'¿A qué o a quién me estoy aferrando por miedo a perder, no por amor?',refl:'No todo lo que amas tiene que quedarse.\nAlgunas personas, lugares y versiones de ti vienen para enseñarte y luego continúan su camino.\nDejarlos ir no borra lo que fueron. Lo honra.',aff:'"Amo y suelto. El amor verdadero no necesita cadenas."'},en:{title:'Attachment',prompt:'To what or whom am I clinging out of fear of losing, not out of love?',refl:'Not everything you love has to stay.\nSome people, places, and versions of yourself come to teach you and then continue on their way.\nLetting them go doesn\'t erase what they were. It honors it.',aff:'"I love and I release. True love needs no chains."'}},
{id:24,s:'soltar',sn:'II',es:{title:'El ruido',prompt:'¿Qué escucharía si apagara todo el ruido externo por un momento?',refl:'Vivimos en un mundo que no para de hablar.\nOpiniones, noticias, expectativas ajenas.\nHoy el universo te invita al silencio.\nDentro de ti hay una claridad que solo aparece cuando todo calla.',aff:'"Me doy el regalo del silencio para escucharme a mí."'},en:{title:'The Noise',prompt:'What would I hear if I turned off all the external noise for a moment?',refl:'We live in a world that never stops talking.\nOpinions, news, others\' expectations.\nToday the universe invites you to silence.\nInside you there is a clarity that only appears when everything goes quiet.',aff:'"I give myself the gift of silence to listen to myself."'}},
{id:25,s:'soltar',sn:'II',es:{title:'La necesidad de aprobación',prompt:'¿De qué o de quién estoy esperando una aprobación que puedo darme a mí mismx?',refl:'Cuánta energía gastamos esperando que alguien diga que lo que somos es suficiente.\nEsa persona eres tú.\nY ya puedes decírtelo hoy.',aff:'"Mi aprobación es la única que necesito para empezar."'},en:{title:'The Need for Approval',prompt:'From what or whom am I waiting for an approval I can give myself?',refl:'How much energy we spend waiting for someone to say that what we are is enough.\nThat person is you.\nAnd you can already tell yourself today.',aff:'"My own approval is the only one I need to begin."'}},
{id:26,s:'soltar',sn:'II',es:{title:'El ciclo que termina',prompt:'¿Qué ciclo siento que está cerrando en mi vida y me resisto a soltar?',refl:'Algo está llegando a su fin.\nNo lo fuerces a quedarse.\nLos finales no son fracasos:\nson la forma que tiene el universo de hacer espacio para lo que todavía no puedes imaginar.',aff:'"Cierro este ciclo con gratitud y abro el siguiente con fe."'},en:{title:'The Ending Cycle',prompt:'What cycle do I feel is closing in my life and I resist releasing?',refl:'Something is coming to an end.\nDon\'t force it to stay.\nEndings are not failures:\nthey are the universe\'s way of making space for what you cannot yet imagine.',aff:'"I close this cycle with gratitude and open the next with faith."'}},
{id:27,s:'crecer',sn:'III',es:{title:'La raíz',prompt:'¿En qué estoy cimentando mi vida y mi identidad en este momento?',refl:'El árbol más alto tiene las raíces más profundas.\nAntes de crecer hacia afuera, crece hacia adentro.\n¿Qué valores, qué certezas, qué amor propio estás cultivando en lo profundo de ti?',aff:'"Mis raíces son firmes. Puedo crecer sin perderme."'},en:{title:'The Root',prompt:'What am I grounding my life and identity in at this moment?',refl:'The tallest tree has the deepest roots.\nBefore growing outward, grow inward.\nWhat values, what certainties, what self-love are you cultivating in your depths?',aff:'"My roots are firm. I can grow without losing myself."'}},
{id:28,s:'crecer',sn:'III',es:{title:'El error',prompt:'¿Qué me enseñó mi error más reciente que no podría haber aprendido de otra forma?',refl:'Los errores no son el opuesto del éxito.\nSon parte del camino hacia él.\nCada vez que te equivocas y lo reconoces le estás diciendo al universo:\nSigo aquí, sigo intentando.',aff:'"Me equivoco, aprendo y me levanto. Eso es crecer."'},en:{title:'The Mistake',prompt:'What did my most recent mistake teach me that I could not have learned any other way?',refl:'Mistakes are not the opposite of success.\nThey are part of the path toward it.\nEvery time you err and acknowledge it, you are telling the universe:\nI am still here, I am still trying.',aff:'"I make mistakes, I learn, and I rise. That is growth."'}},
{id:29,s:'crecer',sn:'III',es:{title:'La incomodidad',prompt:'¿Qué incomodidad estoy evitando que podría llevarme a donde quiero estar?',refl:'Nada que valga la pena te esperará dentro de tu zona de confort.\nLa incomodidad no es una señal de que algo está mal.\nEs una señal de que algo nuevo está comenzando.\nProto tendrás el músculo para sostenerlo.',aff:'"La incomodidad es el precio de entrada al crecimiento y la pago con gusto."'},en:{title:'Discomfort',prompt:'What discomfort am I avoiding that could take me where I want to be?',refl:'Nothing worth having is waiting for you inside your comfort zone.\nDiscomfort is not a signal that something is wrong.\nIt is a signal that something new is beginning.\nSoon you will have the muscle to sustain it.',aff:'"Discomfort is the entry price for growth, and I pay it gladly."'}},
{id:30,s:'crecer',sn:'III',es:{title:'La disciplina',prompt:'¿Qué compromiso conmigo mismx llevo tiempo aplazando?',refl:'La libertad más profunda viene de la disciplina.\nNo la que te imponen, sino la que te das.\nEl ritual diario, la constancia silenciosa,\nel comprometerte contigo mismx aunque nadie esté mirando.',aff:'"Me cuido a través de mis acciones, no solo de mis intenciones."'},en:{title:'Discipline',prompt:'What commitment to myself have I been postponing?',refl:'The deepest freedom comes from discipline.\nNot the kind imposed on you, but the kind you give yourself.\nThe daily ritual, the quiet consistency,\ncommitting to yourself even when no one is watching.',aff:'"I care for myself through my actions, not just my intentions."'}},
{id:31,s:'crecer',sn:'III',es:{title:'El maestro',prompt:'¿Qué está intentando enseñarme la situación que más me está costando?',refl:'Los maestros no siempre llegan en forma de persona.\nA veces llegan como circunstancias,\ncomo pérdidas, como personas difíciles,\ncomo situaciones que no elegiste.\nTodo enseña. Todo.',aff:'"Estoy siempre aprendiendo. La vida es mi maestra."'},en:{title:'The Teacher',prompt:'What is the situation that is costing me the most trying to teach me?',refl:'Teachers don\'t always arrive in the form of a person.\nSometimes they come as circumstances,\nas losses, as difficult people,\nas situations you didn\'t choose.\nEverything teaches. Everything.',aff:'"I am always learning. Life is my teacher."'}},
{id:32,s:'crecer',sn:'III',es:{title:'El límite',prompt:'¿En qué situación de mi vida necesito poner un límite que aún no he puesto?',refl:'Un límite no es una pared que separa.\nEs un puente que te conecta contigo mismx.\nDecir «hasta aquí» no es egoísmo:\nEs el acto más honesto y más amoroso que puedes hacer.',aff:'"Mis límites me definen y me protegen. Los sostengo con amor."'},en:{title:'The Boundary',prompt:'In what situation in my life do I need to set a boundary I haven\'t set yet?',refl:'A boundary is not a wall that separates.\nIt is a bridge that connects you to yourself.\nSaying "this far" is not selfishness:\nIt is the most honest and most loving act you can do.',aff:'"My boundaries define and protect me. I hold them with love."'}},
{id:33,s:'crecer',sn:'III',es:{title:'La vulnerabilidad',prompt:'¿Con quién o en qué espacio me permito ser realmente vulnerable?',refl:'Mostrarte vulnerable no es debilidad.\nEs decirle al mundo: estoy aquí, soy real, me importa esto.\nLas conexiones más profundas nacen en el lugar donde te atreves a no estar perfectamente bien.',aff:'"Mi vulnerabilidad es mi puerta hacia la conexión auténtica."'},en:{title:'Vulnerability',prompt:'With whom or in what space do I allow myself to be truly vulnerable?',refl:'Showing your vulnerability is not weakness.\nIt is telling the world: I am here, I am real, this matters to me.\nThe deepest connections are born in the place where you dare not to be perfectly okay.',aff:'"My vulnerability is my door to authentic connection."'}},
{id:34,s:'crecer',sn:'III',es:{title:'La paciencia',prompt:'¿En qué área de mi vida estoy esperando resultados inmediatos de un proceso que necesita tiempo?',refl:'El bambú crece bajo la tierra durante años.\nNadie ve su proceso. Nadie lo aplaude.\nUn día aparece, y crece más rápido que cualquier otra planta.\nLo que cultivas en silencio tiene su momento.',aff:'"Confío en mi proceso aunque no sea visible para nadie más."'},en:{title:'Patience',prompt:'In what area of my life am I expecting immediate results from a process that needs time?',refl:'Bamboo grows underground for years.\nNo one sees its process. No one applauds it.\nOne day it appears, and grows faster than any other plant.\nWhat you cultivate in silence has its moment.',aff:'"I trust my process even if it is not visible to anyone else."'}},
{id:35,s:'crecer',sn:'III',es:{title:'La tribu',prompt:'¿Qué personas me hacen crecer y cuáles me detienen?',refl:'No estás hechx para crecer solx.\nHay personas en este mundo que vibran en tu frecuencia y te entienden sin que tengas que traducirte.\nBúscalas. Y cuando las encuentres, quédate.',aff:'"Me rodeo de quienes me elevan y yo los elevo a ellos."'},en:{title:'The Tribe',prompt:'What people make me grow and which ones hold me back?',refl:'You are not made to grow alone.\nThere are people in this world who vibrate at your frequency and understand you without you having to translate yourself.\nSeek them. And when you find them, stay.',aff:'"I surround myself with those who lift me, and I lift them."'}},
{id:36,s:'crecer',sn:'III',es:{title:'El don',prompt:'¿Qué se me da con tal naturalidad que lo doy por sentado?',refl:'Hay algo que haces con una facilidad que a otros les cuesta trabajo.\nAlgo que das sin esfuerzo y que el mundo necesita.\nLo llamas normal porque es tuyo.\nPero es un don. Y tiene un propósito más grande que tú.',aff:'"Reconozco y ofrezco mis dones al mundo sin minimizarlos."'},en:{title:'The Gift',prompt:'What comes so naturally to me that I take it for granted?',refl:'There is something you do with an ease that others find difficult.\nSomething you give effortlessly that the world needs.\nYou call it normal because it is yours.\nBut it is a gift. And it has a purpose greater than you.',aff:'"I recognize and offer my gifts to the world without minimizing them."'}},
{id:37,s:'crecer',sn:'III',es:{title:'La crisis',prompt:'¿Qué oportunidades esconde la crisis que estoy viviendo?',refl:'Existe una antigua idea oriental que dice que la palabra crisis contiene dos caracteres: peligro y oportunidad.\nLo que está rompiéndose ahora puede ser el inicio de algo que todavía no puedes imaginar.',aff:'"En cada ruptura hay un espacio nuevo que estaba esperando existir."'},en:{title:'The Crisis',prompt:'What opportunities are hidden in the crisis I am living?',refl:'An ancient Eastern idea says that the word crisis contains two characters: danger and opportunity.\nWhat is breaking now may be the beginning of something you cannot yet imagine.',aff:'"In every rupture there is a new space that was waiting to exist."'}},
{id:38,s:'crecer',sn:'III',es:{title:'La acción',prompt:'¿Qué estoy esperando que suceda para tomar acción en algo que ya sé que quiero?',refl:'Pensar no mueve el mundo. Actuar sí.\nNo tienes que tenerlo todo perfecto para empezar.\nLa acción imperfecta le gana siempre a la perfección que nunca sale de tu cabeza.',aff:'"Actúo hoy con lo que tengo, desde donde estoy."'},en:{title:'Action',prompt:'What am I waiting for to take action on something I already know I want?',refl:'Thinking doesn\'t move the world. Action does.\nYou don\'t have to have everything perfect to begin.\nImperfect action always beats the perfection that never leaves your head.',aff:'"I act today with what I have, from where I am."'}},
{id:39,s:'crecer',sn:'III',es:{title:'La confianza ganada',prompt:'¿En qué momentos de mi vida he demostrado que soy más capaz de lo que creo?',refl:'La autoconfianza no llega antes del intento.\nLlega después.\nCada vez que hiciste algo aunque tenías miedo, te dejaste una promesa cumplida.\nYa tienes más evidencia de lo que crees.',aff:'"He sobrevivido todo lo que creí que no podría. Eso me hace confiar en mí."'},en:{title:'Earned Confidence',prompt:'In what moments of my life have I shown I am more capable than I think?',refl:'Self-confidence doesn\'t come before the attempt.\nIt comes after.\nEvery time you did something even though you were afraid, you left yourself a kept promise.\nYou already have more evidence than you think.',aff:'"I have survived everything I thought I couldn\'t. That makes me trust myself."'}},
{id:40,s:'integrar',sn:'IV',es:{title:'El todo',prompt:'¿Qué parte de mí mismx estoy rechazando que necesita ser vista?',refl:'No hay partes de ti que estén equivocadas.\nNi las que te dan vergüenza, ni las que no entiendes, ni las que aún están en proceso.\nTodas esas partes juntas forman algo entero.\nForman algo que se llama: tú.',aff:'"Me acepto completx: sombra y luz, caos y calma."'},en:{title:'The Whole',prompt:'What part of myself am I rejecting that needs to be seen?',refl:'There are no parts of you that are wrong.\nNot the ones that shame you, not the ones you don\'t understand, not the ones still in process.\nAll those parts together form something whole.\nThey form something called: you.',aff:'"I accept myself completely: shadow and light, chaos and calm."'}},
{id:41,s:'integrar',sn:'IV',es:{title:'La sombra',prompt:'¿Qué parte de mí mismx me cuesta más aceptar?',refl:'Todo lo que niegas de ti mismx no desaparece.\nVive en la sombra y sale en los momentos que menos esperas.\nMirar tu sombra no es perderte en ella.\nEs conocerte completx, para que nada tuyo te tome por sorpresa.',aff:'"Miro mi sombra con curiosidad, no con miedo."'},en:{title:'The Shadow',prompt:'What part of myself is hardest for me to accept?',refl:'Everything you deny about yourself does not disappear.\nIt lives in the shadow and comes out in the moments you least expect.\nLooking at your shadow is not getting lost in it.\nIt is knowing yourself completely, so nothing of yours catches you off guard.',aff:'"I look at my shadow with curiosity, not with fear."'}},
{id:42,s:'integrar',sn:'IV',es:{title:'La historia',prompt:'¿Qué historia sobre mí mismx estoy lista para reescribir?',refl:'Eres más que lo que te pasó.\nLa historia que te contaron sobre ti,\nla historia que tú te has contado,\nno es toda la verdad.\nPuedes reescribirla hoy.',aff:'"Soy el autor de mi propia narrativa."'},en:{title:'The Story',prompt:'What story about myself am I ready to rewrite?',refl:'You are more than what happened to you.\nThe story they told you about yourself,\nthe story you have told yourself,\nis not the whole truth.\nYou can rewrite it today.',aff:'"I am the author of my own narrative."'}},
{id:43,s:'integrar',sn:'IV',es:{title:'La gratitud profunda',prompt:'¿Por qué cosas en mi vida siento una gratitud tan grande que me cuesta expresarla?',refl:'No la gratitud que se recita.\nLa que se siente en el pecho cuando ves todo lo que eres, todo lo que tienes, todo lo que has superado para estar aquí, hoy, leyendo esto.',aff:'"Lo que tengo es suficiente. Lo que soy es suficiente."'},en:{title:'Deep Gratitude',prompt:'For what things in my life do I feel a gratitude so great it is hard to express?',refl:'Not the gratitude that is recited.\nThe kind felt in the chest when you see everything you are, everything you have, everything you have overcome to be here, today, reading this.',aff:'"What I have is enough. What I am is enough."'}},
{id:44,s:'integrar',sn:'IV',es:{title:'El servicio',prompt:'¿De qué manera podría contribuir hoy, desde donde estoy, con lo que tengo?',refl:'Cuando creces, tienes algo que dar.\nNo necesitas estar completx para ayudar.\nA veces el acto de dar es exactamente lo que te faltaba para sanar.',aff:'"Dar y recibir son parte del mismo flujo. Participo en ambos."'},en:{title:'Service',prompt:'In what way could I contribute today, from where I am, with what I have?',refl:'When you grow, you have something to give.\nYou don\'t need to be whole to help.\nSometimes the act of giving is exactly what you needed to heal.',aff:'"Giving and receiving are part of the same flow. I participate in both."'}},
{id:45,s:'integrar',sn:'IV',es:{title:'La congruencia',prompt:'¿Qué tan alineadas están mis acciones diarias con lo que digo?',refl:'Hay una distancia entre lo que dices que valoras y lo que haces cada día.\nNo te juzgues por eso.\nSolo obsérvalo. La congruencia se construye con decisiones pequeñas y repetidas.',aff:'"Vivo desde mis valores, no desde mis miedos."'},en:{title:'Congruence',prompt:'How aligned are my daily actions with what I say I value?',refl:'There is a distance between what you say you value and what you do each day.\nDon\'t judge yourself for it.\nJust observe it. Congruence is built with small, repeated decisions.',aff:'"I live from my values, not from my fears."'}},
{id:46,s:'integrar',sn:'IV',es:{title:'La presencia plena',prompt:'¿Cuántos momentos del día realmente habito o solo los atravieso?',refl:'No estás perdiendo el tiempo cuando estás presente.\nEstás ganando la única cosa que de verdad tienes:\nEste momento, este instante, esta respiración.\nNada más existe excepto esto.',aff:'"Estoy aquí. Completamente. Sin reservas."'},en:{title:'Full Presence',prompt:'How many moments of the day do I truly inhabit, or do I simply pass through them?',refl:'You are not wasting time when you are present.\nYou are gaining the only thing you truly have:\nThis moment, this instant, this breath.\nNothing else exists but this.',aff:'"I am here. Completely. Without reservations."'}},
{id:47,s:'integrar',sn:'IV',es:{title:'El legado',prompt:'¿Qué quiero que recuerden de mí las personas que más quiero?',refl:'No tienes que morir para dejar huella.\nLo que dices, lo que haces, cómo tratas a las personas, cómo te tratas a ti mismx:\nTodo eso es legado.\nLo estás construyendo ahora.',aff:'"Construyo mi legado en cada acto pequeño de amor y autenticidad."'},en:{title:'The Legacy',prompt:'What do I want the people I love most to remember about me?',refl:'You don\'t have to die to leave a mark.\nWhat you say, what you do, how you treat others, how you treat yourself:\nAll of that is legacy.\nYou are building it now.',aff:'"I build my legacy in every small act of love and authenticity."'}},
{id:48,s:'integrar',sn:'IV',es:{title:'La impermanencia',prompt:'¿Qué situación que siento permanente en realidad ya está cambiando?',refl:'Nada permanece.\nNi el dolor ni la alegría, ni la confusión ni la claridad.\nEsta verdad no es triste: es liberadora.\nSi nada es para siempre, tampoco lo es lo que te pesa hoy.',aff:'"Todo fluye. Yo fluyo con ello."'},en:{title:'Impermanence',prompt:'What situation I feel is permanent is already changing?',refl:'Nothing remains.\nNot pain nor joy, not confusion nor clarity.\nThis truth is not sad: it is liberating.\nIf nothing is forever, neither is what weighs on you today.',aff:'"Everything flows. I flow with it."'}},
{id:49,s:'integrar',sn:'IV',es:{title:'El amor',prompt:'¿Estoy recibiendo amor con la misma apertura con la que lo doy?',refl:'El amor no es lo que sientes cuando todo está bien.\nEs lo que eliges cuando nada lo está.\nAmarte, amar a otros, dejar que te amen:\nSon las tres formas del mismo acto sagrado.',aff:'"Soy dignx de ser amadx. Completamente, tal como soy."'},en:{title:'Love',prompt:'Am I receiving love with the same openness with which I give it?',refl:'Love is not what you feel when everything is fine.\nIt is what you choose when nothing is.\nLoving yourself, loving others, letting yourself be loved:\nThose are the three forms of the same sacred act.',aff:'"I am worthy of being loved. Completely, just as I am."'}},
{id:50,s:'integrar',sn:'IV',es:{title:'La rendición sagrada',prompt:'¿Con qué estoy peleando que podría simplemente aceptar?',refl:'Rendirse no siempre es perder.\nA veces es el acto más inteligente y más sabio:\nDejar de pelear con lo que es, para usar esa energía en crear lo que puede ser.',aff:'"Acepto lo que es. Desde ahí creo lo que quiero."'},en:{title:'Sacred Surrender',prompt:'What am I fighting that I could simply accept?',refl:'Surrendering is not always losing.\nSometimes it is the most intelligent and wisest act:\nStopping the fight with what is, to use that energy to create what can be.',aff:'"I accept what is. From there I create what I want."'}},
{id:51,s:'integrar',sn:'IV',es:{title:'El regreso',prompt:'¿Qué parte de mí mismx he reencontrado en este proceso?',refl:'Después de todo el viaje, siempre hay un regreso.\nNo al mismo lugar, sino a ti mismx.\nMás sabix, más enterx, más suave.\nEste es el destino de todo camino verdadero:\nvolverte tú.',aff:'"Siempre encuentro el camino de regreso a mí."'},en:{title:'The Return',prompt:'What part of myself have I rediscovered in this process?',refl:'After all the journey, there is always a return.\nNot to the same place, but to yourself.\nWiser, more whole, softer.\nThis is the destination of every true path:\nbecoming you.',aff:'"I always find my way back to myself."'}},
{id:52,s:'integrar',sn:'IV',es:{title:'El universo',prompt:'¿Qué siento cuando me permito creer que pertenezco a algo más grande que yo?',refl:'Estás hechx de la misma materia que las estrellas.\nNo eres pequeñx en un universo grande:\nEres el universo mirándose a sí mismx.\nCada vez que te preguntas quién eres,\nel cosmos entero se detiene a escuchar la respuesta.',aff:'"Pertenezco al universo y el universo vive en mí."'},en:{title:'The Universe',prompt:'What do I feel when I allow myself to believe I belong to something greater than myself?',refl:'You are made of the same matter as the stars.\nYou are not small in a large universe:\nYou are the universe looking at itself.\nEvery time you ask yourself who you are,\nthe entire cosmos stops to listen to the answer.',aff:'"I belong to the universe and the universe lives in me."'}}
];

const SLABELS={despertar:{es:'DESPERTAR',en:'AWAKENING'},soltar:{es:'SOLTAR',en:'RELEASING'},crecer:{es:'CRECER',en:'GROWING'},integrar:{es:'INTEGRAR',en:'INTEGRATING'}};
const SORDER=['despertar','soltar','crecer','integrar'];
const BGCLASS={despertar:'despertar-bg',soltar:'soltar-bg',crecer:'crecer-bg',integrar:'integrar-bg'};
const GDCLASS={despertar:'gd-despertar',soltar:'gd-soltar',crecer:'gd-crecer',integrar:'gd-integrar'};

let lang='es', user=null, card=null;

function skey(e){return'oracle_'+e.toLowerCase().replace(/[^a-z0-9]/g,'_');}
function load(e){try{const r=localStorage.getItem(skey(e));return r?JSON.parse(r):null;}catch{return null;}}
function save(d){try{localStorage.setItem(skey(d.email),JSON.stringify(d));}catch{}}
function cdmxDate(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Mexico_City'});}

function getCard(u){
  const today=cdmxDate();
  if(u.lastDate===today&&u.lastCardId)return CARDS.find(c=>c.id===u.lastCardId);
  let seen=u.seenIds||[];
  let avail=CARDS.filter(c=>!seen.includes(c.id));
  if(!avail.length){seen=[];avail=[...CARDS];}
  const c=avail[Math.floor(Math.random()*avail.length)];
  seen.push(c.id);u.seenIds=seen;u.lastCardId=c.id;u.lastDate=today;
  save(u);return c;
}

function sendToSheets(data){
  fetch(SHEETS_URL,{method:'POST',body:JSON.stringify(data)}).catch(()=>{});
}

function setLang(l,isLogin){
  lang=l;
  document.querySelectorAll('.lbtn').forEach(b=>b.classList.remove('on'));
  if(isLogin){
    document.querySelectorAll('#loginScreen .lbtn').forEach(b=>{if(b.textContent.toLowerCase()===l)b.classList.add('on');});
    document.getElementById('iName').placeholder=l==='es'?'tu nombre':'your name';
    document.getElementById('iEmail').placeholder=l==='es'?'tu correo':'your email';
    document.getElementById('btnEnter').textContent=l==='es'?'ENTRAR':'ENTER';
    document.getElementById('lSub').textContent=l==='es'?'tu carta del día':'your card of the day';
  } else {
    document.getElementById('hEs').classList.toggle('on',l==='es');
    document.getElementById('hEn').classList.toggle('on',l==='en');
    if(card)renderAll(card);
  }
}

function login(){
  const n=document.getElementById('iName').value.trim();
  const e=document.getElementById('iEmail').value.trim();
  const err=document.getElementById('errMsg');
  if(!n){err.textContent=lang==='es'?'Escribe tu nombre.':'Enter your name.';return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){err.textContent=lang==='es'?'Correo inválido.':'Invalid email.';return;}
  err.textContent='';
  let u=load(e)||{name:n,email:e,seenIds:[],lastCardId:null,lastDate:null,notes:{},answers:{}};
  u.name=n;save(u);user=u;card=getCard(u);
  document.getElementById('hName').textContent=n.split(' ')[0];
  // Send login data to sheets
  sendToSheets({date:cdmxDate(),name:n,email:e,section:SLABELS[card.s][lang],card:card[lang].title,reflection:'',question:'',answer:''});
  renderAll(card);
  document.getElementById('loginScreen').classList.remove('active');
  document.getElementById('mainScreen').classList.add('active');
  setLang(lang,false);
}

function renderAll(c){
  const t=c[lang];const sec=c.s;
  document.body.className=BGCLASS[sec];
  document.getElementById('storyCard').className='story-card '+GDCLASS[sec];
  const pillsEl=document.getElementById('pills');
  pillsEl.innerHTML=SORDER.map(s=>`<span class="spill${s===sec?' on':''}">${SLABELS[s][lang]}</span>`).join('');

  // P1
  document.getElementById('covNum').textContent=c.sn;
  document.getElementById('covSec').textContent=SLABELS[sec][lang];
  document.getElementById('covDate').textContent=new Date().toLocaleDateString(lang==='es'?'es-MX':'en-US',{weekday:'long',month:'long',day:'numeric',timeZone:'America/Mexico_City'});
  document.getElementById('scrollHintTxt').textContent=lang==='es'?'desliza para revelar':'swipe to reveal';

  // P2
  document.getElementById('scNum').textContent=c.sn;
  document.getElementById('scTitle').textContent=t.title;
  document.getElementById('scRefl').innerHTML='<span>'+t.refl.replace(/\n/g,'<br>')+'</span>';
  const ps='✦ '+t.prompt+' ✦ ';
  const maxChars=60;
  document.getElementById('ptxt').textContent=ps.length>maxChars?t.prompt.substring(0,maxChars-3)+'...':ps;
  document.getElementById('affLbl').textContent=lang==='es'?'Afirmación':'Affirmation';
  document.getElementById('affTxt').textContent=t.aff;
  document.getElementById('shareTxt').textContent=lang==='es'?'compartir':'share';

  // P3 — reflection
  document.getElementById('reflHeading').textContent=lang==='es'?'Tu reflexión':'Your reflection';
  document.getElementById('reflSub').textContent=lang==='es'?'¿Qué te despertó esta carta?':'What did this card awaken in you?';
  document.getElementById('reflNoteLabel').textContent=lang==='es'?'tu nota de hoy':'your note today';
  document.getElementById('reflTa').placeholder=lang==='es'?'Escribe aquí tu reflexión...':'Write your reflection here...';
  document.getElementById('saveNoteBtn').textContent=lang==='es'?'GUARDAR':'SAVE';
  document.getElementById('editNoteBtn').textContent=lang==='es'?'EDITAR':'EDIT';
  const today=cdmxDate();
  const nk=`${c.id}_${today}`;
  const saved=(user.notes||{})[nk]||'';
  if(saved){
    document.getElementById('savedNoteDisplay').textContent=saved;
    document.getElementById('reflDisplay').style.display='block';
    document.getElementById('reflEdit').style.display='none';
    document.getElementById('reflTa').value=saved;
  } else {
    document.getElementById('reflDisplay').style.display='none';
    document.getElementById('reflEdit').style.display='block';
    document.getElementById('reflTa').value='';
    document.getElementById('reflCount').textContent='0 / 500';
  }

  // P4 — oracle (one Q&A per day, locked after answered)
  document.getElementById('askHeading').textContent=lang==='es'?'El oráculo':'The oracle';
  document.getElementById('askSub').textContent=lang==='es'?'Una pregunta, una respuesta.':'One question, one answer.';
  document.getElementById('askTa').placeholder=lang==='es'?'¿Qué quieres preguntarle al oráculo?':'What do you want to ask the oracle?';
  document.getElementById('askBtn').textContent=lang==='es'?'PREGUNTAR':'ASK';
  document.getElementById('oracleQLabel').textContent=lang==='es'?'tu pregunta':'your question';
  document.getElementById('oracleALabel').textContent=lang==='es'?'respuesta del oráculo':'oracle\'s answer';
  document.getElementById('oracleLocked').textContent=lang==='es'?'El oráculo solo responde una vez al día. Vuelve mañana.':'The oracle answers only once a day. Come back tomorrow.';
  const ak=`${c.id}_${today}`;
  const savedA=(user.answers||{})[ak];
  if(savedA){
    document.getElementById('oracleQDisplay').textContent=savedA.q||'';
    document.getElementById('oracleAnswer').textContent=savedA.a||'';
    document.getElementById('oracleAnswerWrap').style.display='block';
    document.getElementById('askInputArea').style.display='none';
  } else {
    document.getElementById('oracleAnswerWrap').style.display='none';
    document.getElementById('askInputArea').style.display='block';
  }

  // P5
  document.getElementById('notifHeading').textContent=lang==='es'?'Recibe tu carta cada día':'Receive your card every day';
  document.getElementById('notifTitle').textContent=lang==='es'?'RECORDATORIO DIARIO':'DAILY REMINDER';
  document.getElementById('notifMo').textContent=lang==='es'?'/ mes':'/ month';
  const perks=lang==='es'
    ?['Tu carta del día directo a tu correo','Hora personalizada para recibirla','Historial de tus 52 cartas']
    :['Your daily card sent to your email','Personalized delivery time','History of all 52 cards'];
  document.getElementById('notifPerks').innerHTML=perks.map(p=>`<div class="perk"><div class="perk-dot"></div><span>${p}</span></div>`).join('');
  document.getElementById('notifBtn').textContent=lang==='es'?'ACTIVAR RECORDATORIO':'ACTIVATE REMINDER';
  document.getElementById('notifLegal').textContent=lang==='es'?'Próximamente. Sé el primero en activarlo.':'Coming soon. Be the first to activate it.';
}

// Reflection
document.getElementById('reflTa').addEventListener('input',function(){
  document.getElementById('reflCount').textContent=this.value.length+' / 500';
});

function saveNote(){
  const val=document.getElementById('reflTa').value.trim();
  if(!val)return;
  const today=cdmxDate();const nk=`${card.id}_${today}`;
  if(!user.notes)user.notes={};
  user.notes[nk]=val;save(user);
  document.getElementById('savedNoteDisplay').textContent=val;
  document.getElementById('reflDisplay').style.display='block';
  document.getElementById('reflEdit').style.display='none';
  // Update sheets with reflection
  sendToSheets({date:today,name:user.name,email:user.email,section:SLABELS[card.s][lang],card:card[lang].title,reflection:val,question:'',answer:''});
}

function editNote(){
  document.getElementById('reflDisplay').style.display='none';
  document.getElementById('reflEdit').style.display='block';
}

// Oracle — one Q&A per day
async function askOracle(){
  const q=document.getElementById('askTa').value.trim();
  if(!q)return;
  const btn=document.getElementById('askBtn');
  btn.disabled=true;
  btn.textContent=lang==='es'?'...':'...';
  const t=card[lang];
  const sys=lang==='es'
    ?`Eres un oráculo espiritual sabio y poético. El usuario recibió hoy la carta "${t.title}" con reflexión: "${t.refl}" y afirmación: "${t.aff}". Responde en máximo 3 oraciones, de forma poética y directa. Habla de tú. Sin listas ni bullet points.`
    :`You are a wise and poetic spiritual oracle. The user received today the card "${t.title}" with reflection: "${t.refl}" and affirmation: "${t.aff}". Answer in maximum 3 sentences, poetically and directly. Use "you". No lists or bullet points.`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:180,system:sys,messages:[{role:'user',content:q}]})
    });
    const data=await res.json();
    const ans=data.content?.find(b=>b.type==='text')?.text||'...';
    const today=cdmxDate();const ak=`${card.id}_${today}`;
    if(!user.answers)user.answers={};
    user.answers[ak]={q,a:ans};save(user);
    document.getElementById('oracleQDisplay').textContent=q;
    document.getElementById('oracleAnswer').textContent=ans;
    document.getElementById('oracleAnswerWrap').style.display='block';
    document.getElementById('askInputArea').style.display='none';
    // Send to sheets
    sendToSheets({date:today,name:user.name,email:user.email,section:SLABELS[card.s][lang],card:card[lang].title,reflection:(user.notes||{})[ak]||'',question:q,answer:ans});
  }catch{
    btn.disabled=false;
    btn.textContent=lang==='es'?'PREGUNTAR':'ASK';
  }
}

// Share
function shareCard(){
  const t=card[lang];
  const text=`✦ ${t.title}\n\n${t.refl}\n\n${t.aff}\n\nOracle — ${SLABELS[card.s][lang]}`;
  if(navigator.share){navigator.share({title:'Oracle',text});}
  else if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>{
      const sb=document.getElementById('shareTxt');
      const o=sb.textContent;sb.textContent=lang==='es'?'copiado ✓':'copied ✓';
      setTimeout(()=>{sb.textContent=o;},2000);
    });
  }
}

function notifyPlaceholder(){
  const b=document.getElementById('notifBtn');
  const o=b.textContent;
  b.textContent=lang==='es'?'¡Pronto te avisamos!':'We\'ll notify you soon!';
  setTimeout(()=>{b.textContent=o;},2500);
}

// Nav dots
function goPanel(i){
  document.querySelectorAll('.panel')[i].scrollIntoView({behavior:'smooth'});
}
const sa=document.getElementById('scrollArea');
sa.addEventListener('scroll',()=>{
  const panels=sa.querySelectorAll('.panel');
  const st=sa.scrollTop,h=sa.clientHeight;
  let idx=0;
  panels.forEach((p,i)=>{if(p.offsetTop<=st+h/2)idx=i;});
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>d.classList.toggle('on',i===idx));
},{passive:true});

function logout(){
  user=null;card=null;
  document.body.className='';
  document.getElementById('mainScreen').classList.remove('active');
  document.getElementById('loginScreen').classList.add('active');
  document.getElementById('iName').value='';
  document.getElementById('iEmail').value='';
  sa.scrollTop=0;
}
</script>
</body>
</html>
